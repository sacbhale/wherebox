{% extends "base.html" %}
{% block title %}Search · {{ app_name }}{% endblock %}
{% block content %}
<h1>Search</h1>
<form class="stack" method="get" action="/search" role="search" id="search-form">
  <div class="searchbar">
    <input type="search" name="q" value="{{ q }}" placeholder="Search items…" aria-label="Search items"
           autocomplete="off" autofocus
           hx-get="/search" hx-trigger="input changed delay:250ms, search"
           hx-target="#results" hx-include="#search-form" hx-sync="this:replace">
    <button type="submit">Search</button>
  </div>
  <details class="filters" {% if filters.active %}open{% endif %}>
    <summary>Filters</summary>
    <div class="stack">
      <label>Location
        <select name="loc">
          <option value="">Anywhere</option>
          {% for loc in locations %}
          <option value="{{ loc.id }}" {% if filters.loc == loc.id %}selected{% endif %}>{{ loc.path }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="check"><input type="checkbox" name="sub" value="1" {% if filters.sub %}checked{% endif %}> Include sub-locations</label>
      <label>Category
        <select name="category">
          <option value="">Any</option>
          {% for cat in categories %}
          <option value="{{ cat.id }}" {% if filters.category == cat.id %}selected{% endif %}>{{ cat.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Kind
        <select name="kind">
          <option value="">Any</option>
          <option value="consumable" {% if filters.kind == "consumable" %}selected{% endif %}>Consumable</option>
          <option value="belonging" {% if filters.kind == "belonging" %}selected{% endif %}>Belonging</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" name="review" value="1" {% if filters.review %}checked{% endif %}> Needs review</label>
      <label>Expiring within (days)
        <input type="number" name="expiring_days" min="0" inputmode="numeric"
               value="{{ filters.expiring_days if filters.expiring_days is not none else '' }}">
      </label>
      <button type="submit">Apply filters</button>
    </div>
  </details>
</form>
<div id="results" aria-live="polite">
  {% include "partials/search_results.html" %}
</div>
{% endblock %}
