[project]
name = "inventory-app"
version = "0.1.0"
description = "Self-hosted household inventory with AI capture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<0.144",
    "starlette>=1.3.1,<2",  # security floor independent of FastAPI's range
    "uvicorn[standard]>=0.31,<1",  # 0.31.0 added CIDR networks in FORWARDED_ALLOW_IPS
    "python-multipart>=0.0.9,<0.1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pillow>=12.3,<13",
    "pillow-heif>=1.3,<2",
    "pypdfium2>=4.30,<5",
    "segno>=1.6,<1.7",
    "argon2-cffi>=23.1,<24",
    "anthropic>=1.9,<2",
    "httpx2>=2.13,<3",
    "httpx>=0.27,<0.29",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=9.0.3,<10",
    "pytest-playwright>=0.5",
    "zxing-cpp>=2.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The location path separator ("Garage › Shelf 2") is intentional.
allowed-confusables = ["›"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
